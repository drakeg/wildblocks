name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildblocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: windows-x64, runner: windows-2025 }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run all unit and server integration tests
        run: npm test
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Package client and standalone server
        run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  portable:
    name: Portable server source package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Build portable server (requires Node.js)
        run: |
          node scripts/build-portable-server.mjs build/Wildblocks-Server-Portable
          mkdir -p build/artifacts
          VERSION=$(node -p "require('./package.json').version")
          cd build
          zip -qr "artifacts/Wildblocks-Server-${VERSION}-portable.zip" Wildblocks-Server-Portable
      - uses: actions/upload-artifact@v4
        with:
          name: packages-portable
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish downloadable release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [package, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Verify package set and generate checksums
        run: node scripts/release-manifest.mjs release-assets
      - name: Publish a versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag must match package.json version" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; existing downloads are preserved."
            exit 0
          fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Wildblocks $VERSION" --notes-file RELEASE-NOTES.md --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
